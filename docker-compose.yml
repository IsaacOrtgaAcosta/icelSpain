services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: icel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icel_user
      POSTGRES_PASSWORD: icel_password
      POSTGRES_DB: icel_db
    ports:
      - "5433:5432"
    volumes:
      - icel_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: icel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - icel_redis_data:/data

volumes:
  icel_postgres_data:
  icel_redis_data: